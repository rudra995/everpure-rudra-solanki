<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <!-- source data -->
  <rect x="20" y="150" width="130" height="70" rx="6" fill="#f5f5f5" stroke="#666666"/>
  <text x="85" y="178" text-anchor="middle" font-weight="bold">Source CSV</text>
  <text x="85" y="195" text-anchor="middle">2,000 rows</text>
  <text x="85" y="210" text-anchor="middle" font-size="10" fill="#333">data/raw/</text>

  <!-- pandas cleaning -->
  <rect x="200" y="20" width="170" height="80" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="285" y="45" text-anchor="middle" font-weight="bold">Cleaning (pandas)</text>
  <text x="285" y="62" text-anchor="middle">named rules, issue log</text>
  <text x="285" y="77" text-anchor="middle">16 tests</text>
  <text x="285" y="92" text-anchor="middle" font-size="10" fill="#333">analysis/</text>

  <!-- SQL suite container -->
  <rect x="200" y="125" width="320" height="200" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="360" y="145" text-anchor="middle" font-weight="bold">SQL suite (DuckDB or Snowflake)</text>
  <text x="360" y="160" text-anchor="middle" font-size="10" fill="#333">sql/duckdb/  ·  sql/snowflake/</text>
  <rect x="220" y="172" width="130" height="34" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="285" y="193" text-anchor="middle">raw</text>
  <rect x="370" y="172" width="130" height="34" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="435" y="186" text-anchor="middle">ACCOUNT_USAGE</text>
  <text x="435" y="200" text-anchor="middle" font-size="10">(simulated)</text>
  <rect x="220" y="226" width="130" height="34" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="285" y="240" text-anchor="middle">staging</text>
  <text x="285" y="254" text-anchor="middle" font-size="10">defect flags</text>
  <rect x="370" y="226" width="130" height="34" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="435" y="240" text-anchor="middle">marts</text>
  <text x="435" y="254" text-anchor="middle" font-size="10">cost, health</text>
  <rect x="295" y="280" width="130" height="34" fill="#ffffff" stroke="#6c8ebf"/>
  <text x="360" y="294" text-anchor="middle">audit</text>
  <text x="360" y="308" text-anchor="middle" font-size="10">15 checks, issue log</text>
  <line x1="350" y1="189" x2="368" y2="189" stroke="#000" marker-end="url(#arrow)"/>
  <line x1="435" y1="206" x2="300" y2="224" stroke="#000" marker-end="url(#arrow)"/>
  <line x1="350" y1="243" x2="368" y2="243" stroke="#000" marker-end="url(#arrow)"/>
  <line x1="435" y1="260" x2="400" y2="278" stroke="#000" marker-end="url(#arrow)"/>

  <!-- backend -->
  <rect x="580" y="125" width="170" height="200" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="665" y="148" text-anchor="middle" font-weight="bold">Backend (Express)</text>
  <text x="665" y="163" text-anchor="middle" font-size="10" fill="#333">backend/</text>
  <text x="595" y="190">• JWT sign-in</text>
  <text x="595" y="208">• RBAC: 4 roles,</text>
  <text x="607" y="223">row + field filters</text>
  <text x="595" y="241">• REST API</text>
  <text x="595" y="259">• Telemetry replay</text>
  <text x="595" y="277">• Alert rules</text>
  <text x="607" y="292">(&gt; 15 s, FAILED,</text>
  <text x="607" y="307">TIMED_OUT)</text>

  <!-- frontend -->
  <rect x="810" y="125" width="130" height="200" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="875" y="148" text-anchor="middle" font-weight="bold">Dashboard</text>
  <text x="875" y="163" text-anchor="middle" font-weight="bold">(React)</text>
  <text x="875" y="178" text-anchor="middle" font-size="10" fill="#333">frontend/</text>
  <text x="822" y="205">• System health</text>
  <text x="822" y="223">• Orphaned reports</text>
  <text x="822" y="241">• Live alerts</text>
  <text x="822" y="259">• Cost attribution</text>
  <text x="822" y="277">• Data quality</text>
  <text x="822" y="300" font-size="11">UI changes by role</text>

  <!-- arrows between blocks -->
  <line x1="150" y1="185" x2="198" y2="189" stroke="#000" marker-end="url(#arrow)"/>
  <polyline points="85,150 85,60 198,60" fill="none" stroke="#000" marker-end="url(#arrow)"/>
  <line x1="520" y1="225" x2="578" y2="225" stroke="#000" marker-end="url(#arrow)"/>
  <text x="549" y="216" text-anchor="middle" font-size="10">SQL</text>
  <line x1="750" y1="195" x2="808" y2="195" stroke="#000" marker-end="url(#arrow)"/>
  <text x="779" y="186" text-anchor="middle" font-size="10">REST</text>
  <line x1="750" y1="255" x2="808" y2="255" stroke="#000" marker-end="url(#arrow)"/>
  <text x="779" y="246" text-anchor="middle" font-size="10">WebSocket</text>
  <text x="779" y="272" text-anchor="middle" font-size="10">alerts</text>

  <!-- reconciliation (dashed) -->
  <line x1="370" y1="60" x2="530" y2="60" stroke="#b85450" stroke-dasharray="6 4"/>
  <line x1="530" y1="60" x2="530" y2="123" stroke="#b85450" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="392" y="30" width="160" height="22" fill="#f8cecc" stroke="#b85450"/>
  <text x="472" y="45" text-anchor="middle" font-size="11">reconciled: 35/35</text>

  <!-- legend / note -->
  <rect x="200" y="350" width="550" height="60" fill="#ffffff" stroke="#999999" stroke-dasharray="3 3"/>
  <text x="215" y="372" font-size="11">DATA_SOURCE=duckdb (default, built automatically from sql/duckdb/) or snowflake (live, key-pair auth).</text>
  <text x="215" y="390" font-size="11">Both engines run the same views; every API endpoint returns identical results on both (26/26).</text>
  <text x="215" y="403" font-size="11" fill="#555">Dashed red = independent cross-check between pandas and SQL.</text>
</svg>
