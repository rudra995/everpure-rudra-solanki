<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="204" viewBox="0 16 1050 204" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect y="16" width="1050" height="204" fill="#ffffff"/>

  <!-- source CSV -->
  <rect x="10" y="85" width="130" height="80" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="75" y="118" text-anchor="middle" font-weight="bold">Source CSV</text>
  <text x="75" y="137" text-anchor="middle" font-size="11.5" fill="#444">2,000 snapshots</text>
  <text x="75" y="152" text-anchor="middle" font-size="11.5" fill="#444">100 reports</text>

  <!-- DuckDB cylinder -->
  <path d="M210,32 v56 a65,12 0 0 0 130,0 v-56" fill="#fff2cc" stroke="#d6b656"/>
  <ellipse cx="275" cy="32" rx="65" ry="12" fill="#fff2cc" stroke="#d6b656"/>
  <text x="275" y="66" text-anchor="middle" font-weight="bold">DuckDB</text>
  <text x="275" y="83" text-anchor="middle" font-size="11.5" fill="#333">default, no account</text>

  <!-- Snowflake cylinder -->
  <path d="M210,150 v56 a65,12 0 0 0 130,0 v-56" fill="#dae8fc" stroke="#6c8ebf"/>
  <ellipse cx="275" cy="150" rx="65" ry="12" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="275" y="184" text-anchor="middle" font-weight="bold">Snowflake</text>
  <text x="275" y="201" text-anchor="middle" font-size="11.5" fill="#333">live deployment</text>

  <!-- SQL views -->
  <rect x="420" y="80" width="150" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="495" y="110" text-anchor="middle" font-weight="bold">SQL views</text>
  <text x="495" y="129" text-anchor="middle" font-size="11.5" fill="#333">staging, cost marts,</text>
  <text x="495" y="145" text-anchor="middle" font-size="11.5" fill="#333">audit checks</text>

  <!-- backend -->
  <rect x="630" y="80" width="150" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="705" y="110" text-anchor="middle" font-weight="bold">Express backend</text>
  <text x="705" y="129" text-anchor="middle" font-size="11.5" fill="#333">JWT sign-in, RBAC</text>
  <text x="705" y="145" text-anchor="middle" font-size="11.5" fill="#333">REST, alert rules</text>

  <!-- frontend -->
  <rect x="910" y="80" width="130" height="90" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="975" y="110" text-anchor="middle" font-weight="bold">React frontend</text>
  <text x="975" y="129" text-anchor="middle" font-size="11.5" fill="#333">dashboard,</text>
  <text x="975" y="145" text-anchor="middle" font-size="11.5" fill="#333">view by role</text>

  <!-- CSV loads into both databases -->
  <line x1="140" y1="115" x2="208" y2="65" stroke="#333" marker-end="url(#a)"/>
  <line x1="140" y1="135" x2="208" y2="180" stroke="#333" marker-end="url(#a)"/>
  <text x="170" y="125" text-anchor="middle" font-size="11" fill="#555">load</text>

  <!-- views point back to the databases -->
  <line x1="420" y1="110" x2="342" y2="65" stroke="#333" marker-end="url(#a)"/>
  <line x1="420" y1="140" x2="342" y2="180" stroke="#333" marker-end="url(#a)"/>
  <text x="392" y="128" text-anchor="middle" font-size="11" fill="#555">read</text>

  <!-- backend queries the views -->
  <line x1="630" y1="125" x2="572" y2="125" stroke="#333" marker-end="url(#a)"/>
  <text x="601" y="116" text-anchor="middle" font-size="11" fill="#555">SQL</text>

  <!-- frontend <-> backend -->
  <line x1="910" y1="105" x2="782" y2="105" stroke="#333" marker-end="url(#a)"/>
  <text x="845" y="97" text-anchor="middle" font-size="11" fill="#555">HTTPS requests</text>
  <line x1="780" y1="145" x2="908" y2="145" stroke="#333" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="845" y="162" text-anchor="middle" font-size="11" fill="#555">WebSocket alerts</text>
</svg>
