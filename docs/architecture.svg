<svg xmlns="http://www.w3.org/2000/svg" width="930" height="170" viewBox="0 45 930 170" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect y="45" width="930" height="170" fill="#ffffff"/>

  <!-- 1 source -->
  <rect x="10" y="60" width="150" height="90" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="85" y="95" text-anchor="middle" font-weight="bold">Source CSV</text>
  <text x="85" y="114" text-anchor="middle" font-size="11.5" fill="#444">2,000 snapshots</text>
  <text x="85" y="130" text-anchor="middle" font-size="11.5" fill="#444">100 reports</text>

  <!-- 2 cleaning + SQL -->
  <rect x="215" y="60" width="180" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="305" y="88" text-anchor="middle" font-weight="bold">Cleaning + SQL</text>
  <text x="305" y="107" text-anchor="middle" font-size="11.5" fill="#333">pandas rules, issue log</text>
  <text x="305" y="123" text-anchor="middle" font-size="11.5" fill="#333">ACCOUNT_USAGE sim → marts</text>
  <text x="305" y="139" text-anchor="middle" font-size="11.5" fill="#333">Snowflake / DuckDB</text>

  <!-- 3 backend -->
  <rect x="450" y="60" width="180" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="540" y="88" text-anchor="middle" font-weight="bold">Express API</text>
  <text x="540" y="107" text-anchor="middle" font-size="11.5" fill="#333">JWT sign-in, RBAC</text>
  <text x="540" y="123" text-anchor="middle" font-size="11.5" fill="#333">REST endpoints</text>
  <text x="540" y="139" text-anchor="middle" font-size="11.5" fill="#333">alert rules</text>

  <!-- 4 frontend -->
  <rect x="740" y="60" width="180" height="90" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="830" y="88" text-anchor="middle" font-weight="bold">React dashboard</text>
  <text x="830" y="107" text-anchor="middle" font-size="11.5" fill="#333">health, orphaned reports</text>
  <text x="830" y="123" text-anchor="middle" font-size="11.5" fill="#333">live alerts, cost</text>
  <text x="830" y="139" text-anchor="middle" font-size="11.5" fill="#333">view changes by role</text>

  <!-- arrows -->
  <line x1="160" y1="105" x2="213" y2="105" stroke="#333" marker-end="url(#a)"/>
  <line x1="395" y1="105" x2="448" y2="105" stroke="#333" marker-end="url(#a)"/>
  <text x="421" y="96" text-anchor="middle" font-size="11" fill="#555">SQL</text>
  <line x1="630" y1="92" x2="738" y2="92" stroke="#333" marker-end="url(#a)"/>
  <text x="684" y="84" text-anchor="middle" font-size="11" fill="#555">REST</text>
  <line x1="630" y1="122" x2="738" y2="122" stroke="#333" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="684" y="138" text-anchor="middle" font-size="11" fill="#555">WebSocket alerts</text>

  <!-- footnote -->
  <text x="465" y="195" text-anchor="middle" font-size="11.5" fill="#555">Same SQL views on DuckDB (default, no account) or live Snowflake; results reconciled across pandas, DuckDB and Snowflake.</text>
</svg>
